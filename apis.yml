aid: keatext
name: Keatext
description: >-
  Keatext is a Montreal-based AI text analytics platform that unifies customer
  feedback from surveys, online reviews, and support tickets into a single
  dashboard and produces AI-generated reports identifying themes, sentiment,
  satisfaction drivers, and blind spots. It is purpose-built for customer
  experience (CX) teams, surfacing prioritized, actionable recommendations to
  improve CSAT and reduce churn. Keatext integrates natively with feedback and
  service platforms including SurveyMonkey, Zendesk, QuestionPro, Alchemer,
  ServiceNow, Qualtrics, Intercom, Salesforce, and Yotpo, and connects to 400+
  additional systems through the Tray.io integration platform. Customers include
  Intuit, Lenovo, Hilton, and COOLA. The company does not publish a public
  developer REST API or OpenAPI; custom integration is handled via Tray.io and
  direct partner engagement. Added to the API Evangelist network as a 500 Global
  portfolio company.
